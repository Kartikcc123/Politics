name: political_booth_crm
description: Political Booth Management CRM - Mobile Flutter app
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.3
  file_picker: 10.3.10
  printing: ^5.14.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/party/
    - assets/voter_phone_book_logo.png
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf


