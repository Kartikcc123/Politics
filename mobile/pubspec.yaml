name: political_booth_crm
description: Political Booth Management CRM - Mobile Flutter app
publish_to: 'none'
version: 1.0.9+11

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: any
  intl: any
  file_picker: ^8.0.0
  printing: any
  url_launcher: any
  shared_preferences: any
  speech_to_text: ^7.0.0
  share_plus: ^12.0.0
  path_provider: any
  archive: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/party/
    - assets/voter_phone_book_logo.png
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf


