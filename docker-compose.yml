version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: politics_backend
    restart: unless-stopped
    ports:
      - "5003:5000"
    env_file:
      - backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/whatsapp-sessions:/app/whatsapp-sessions
    environment:
      - NODE_ENV=production
      - IMAGE_CROP_CONCURRENCY=12
      - OCR_CELL_CONCURRENCY=4
      - OCR_THREAD_WORKERS=4
      - OCR_PAGE_CONCURRENCY=2
      - OCR_DPI=250
      - PYTHONUNBUFFERED=1
      - OMP_THREAD_LIMIT=2
